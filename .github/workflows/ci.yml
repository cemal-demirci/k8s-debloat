name: ci

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: shellcheck -S warning *.sh tests/*.sh

  e2e:
    name: Real k3s install + cleanup end-to-end
    needs: shellcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install, fixtures, dry run, apply, uninstall
        run: sudo bash tests/e2e.sh
